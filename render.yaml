services:
  - type: web
    name: razorpay-webhook-server
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Razorpay ──────────────────────────────────────────────
      # Secret set when creating the webhook in the Razorpay Dashboard.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ── Brevo SMTP (transactional email) ─────────────────────
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false

      # ── WhatsApp (self-hosted bot) ────────────────────────────
      - key: WHATSAPP_BOT_URL
        value: http://34.28.139.132/send-message
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "+91"

      # ── Branding ──────────────────────────────────────────────
      - key: EVENT_NAME
        value: My Event
      - key: MAIL_FROM_NAME
        value: Event Team
